<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#04030a; }

    #bg { position:fixed; inset:0; z-index:0; }

    .fog {
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:
        radial-gradient(ellipse 80% 55% at 50% 105%, rgba(55,12,100,.45) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 12%  65%, rgba(10,45,120,.28) 0%, transparent 55%),
        radial-gradient(ellipse 40% 35% at 90%  25%, rgba(80,18,55,.2)   0%, transparent 55%);
      animation: fog-drift 9s ease-in-out infinite alternate;
    }
    @keyframes fog-drift { from { opacity:.8; } to { opacity:1; } }

    #app {
      position:relative; z-index:2;
      width:100vw; height:100vh;
      display:flex; align-items:center; justify-content:center;
    }

    /* ── Circle stage ── */
    #circle-stage {
      position:relative;
      width:  min(70vh, 70vw, 660px);
      height: min(70vh, 70vw, 660px);
    }

    /* ── SVG ring animations ── */
    .ring-outer-g { animation: spin-cw  45s linear infinite; }
    .ring-mid-g   { animation: spin-ccw 28s linear infinite; }
    .ring-inner-g { animation: pulse-g   5s ease-in-out infinite; }
    @keyframes spin-cw  { to { transform: rotate(360deg);  } }
    @keyframes spin-ccw { to { transform: rotate(-360deg); } }
    @keyframes pulse-g  { 0%,100%{ opacity:.65; } 50%{ opacity:1; } }

    #circle-stage.activated .ring-inner-g {
      animation: pulse-active 1.1s ease-in-out infinite;
    }
    @keyframes pulse-active {
      0%,100% { opacity:.72; filter: brightness(1.8) drop-shadow(0 0 7px  rgba(196,164,74,.75)); }
      50%     { opacity:1;   filter: brightness(3.2) drop-shadow(0 0 18px rgba(196,164,74,1));   }
    }

    /* ── Player orbs ── */
    .player-orb {
      position:absolute;
      transform: translate(-50%,-50%);
      cursor:pointer; z-index:10;
      opacity:0;
      animation: orb-appear .5s ease-out forwards;
    }
    @keyframes orb-appear { to { opacity:1; } }

    .orb-shell {
      border-radius:50%;
      border: 2px solid rgba(var(--c),.38);
      background:
        radial-gradient(circle at 38% 32%, rgba(255,255,255,.1) 0%, transparent 52%),
        radial-gradient(circle, rgba(var(--c),.18) 0%, rgba(var(--c),.04) 68%, transparent 100%);
      box-shadow: 0 0 14px rgba(var(--c),.3), inset 0 0 10px rgba(var(--c),.08);
      display:flex; align-items:center; justify-content:center;
      transition: border-color .28s, box-shadow .28s, transform .28s;
      overflow:hidden; position:relative;
    }
    .orb-shell::after {
      content:''; position:absolute; inset:0; border-radius:50%;
      background: conic-gradient(
        rgba(var(--c),0)   0deg,   rgba(var(--c),.22)  60deg,
        rgba(var(--c),0) 120deg,   rgba(var(--c),.1)  210deg,
        rgba(var(--c),0) 265deg,   rgba(var(--c),.18) 320deg,
        rgba(var(--c),0) 360deg
      );
      animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer { to { transform: rotate(360deg); } }

    .orb-mandala {
      position:absolute; inset:0; z-index:1;
      display:flex; align-items:center; justify-content:center;
      pointer-events:none;
    }
    .orb-label {
      position:absolute; top:calc(100% + 5px); left:50%;
      transform:translateX(-50%);
      font-family:'Cinzel', serif; font-weight:500;
      color: rgba(var(--c),.5); white-space:nowrap; letter-spacing:.07em;
      transition: color .28s, text-shadow .28s; pointer-events:none;
    }

    .player-orb:hover .orb-shell,
    .player-orb.active .orb-shell {
      border-color: rgba(var(--c),.9);
      box-shadow: 0 0 28px rgba(var(--c),.72), 0 0 65px rgba(var(--c),.3), inset 0 0 16px rgba(var(--c),.15);
      transform: scale(1.15);
    }
    .player-orb.active .orb-shell { transform: scale(1.22); }
    .player-orb:hover .orb-label,
    .player-orb.active .orb-label { color: rgba(var(--c),1); text-shadow: 0 0 8px rgba(var(--c),.6); }

    /* ── Center display ── */
    #center {
      position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%);
      width:40%; aspect-ratio:1;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; z-index:8; pointer-events:none;
      gap:.5rem;
    }
    #c-hint {
      font-family:'Cinzel', serif;
      font-size:clamp(.44rem,.9vw,.66rem);
      color: rgba(196,164,74,.32); letter-spacing:.28em;
      transition: opacity .3s;
    }
    #c-name {
      font-family:'Cinzel Decorative', serif;
      font-weight:700; letter-spacing:.14em;
      color:#c4a44a; text-shadow: 0 0 18px currentColor;
      opacity:0; transform:scale(.85);
      transition: opacity .32s, transform .32s, color .28s, text-shadow .28s;
      word-break:break-word; padding:0 6px;
      font-size:clamp(.78rem,1.6vw,1.35rem);
      line-height:1.2;
    }

    #center.clickable { cursor:pointer; pointer-events:auto; }
    #center.clickable::before {
      content:''; position:absolute; inset:-18px; border-radius:50%;
      background:radial-gradient(circle, rgba(196,164,74,.16) 0%, transparent 66%);
      animation:star-pulse 2.2s ease-in-out infinite;
      pointer-events:none; z-index:-1;
    }
    @keyframes star-pulse {
      0%,100%{ opacity:.45; transform:scale(.88); }
      50%    { opacity:1;   transform:scale(1.16); }
    }

    /* ── Connector line SVG ── */
    #conn-svg {
      position:absolute; inset:0; pointer-events:none; z-index:7; overflow:visible;
    }
    .conn-glow { stroke-linecap:round; }
    .conn-dash {
      stroke-linecap:round;
      stroke-dasharray: 5 4;
      animation: dash-march .7s linear infinite;
    }
    @keyframes dash-march { to { stroke-dashoffset: 18; } }
  </style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="fog"></div>
<div id="app">
  <div id="circle-stage">
    <svg id="conn-svg"></svg>
    <div id="center">
      <div id="c-hint">SELECT YOUR CHAMPION</div>
      <div id="c-name"></div>
    </div>
  </div>
</div>

<div id="cl-status">Loading&hellip;</div>

<script src="/modules/custom-login/assets/screens/shared.js"></script>
<script>
  history.replaceState(null, '', 'index.html');

  /* ── Module-level state ── */
  let activeEntry = null;
  let activeOrbEl = null;
  let _entries    = [];
  let _showNames  = true;
  let _soundCfg   = {};

  /* ── Utilities ── */
  const f = n => (+n).toFixed(2);
  const hexToRgb = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
  const lcg = s => { let v=s; return () => { v=(v*1664525+1013904223)&0xffffffff; return (v>>>0)/0xffffffff; }; };

  /**
   * Hashes a string to a positive 32-bit integer for use as a deterministic seed.
   * @param {string} s
   * @returns {number}
   */
  function hashStr(s) {
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h;
  }

  /* ── Mandala generator ── */
  /* ── Symbol library ── */
  const SYMBOLS = [
    // Algiz (Proteção)
    '<path d="M12 3v18M12 3L7 9M12 3l5 6"/>',
    // Fehu (Poder)
    '<path d="M6 3v18M6 8h8L17 5M6 14h6l3-3"/>',
    // Othala (Herança)
    '<path d="M12 4L4 20h16L12 4z M9 15l3 3 3-3 M12 18v2"/>',
    // Inguz (Semente)
    '<path d="M12 4l-8 8 8 8 8-8-8-8z M12 4v16 M4 12h16"/>',
    // Valknut
    '<path d="M12 3l-9 16h18L12 3z M12 8l6 11H6L12 8z M8.5 13h7l-3.5 6.5L8.5 13z" opacity="0.9"/>' +
    '<path d="M6 19L12 3l6 16H6z" opacity="0.5"/>' +
    '<path d="M7.5 16.5L12 6l4.5 10.5h-9z"/>',
    // Triskele Espiral
    '<path d="M12 12c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5c0 3.5-2.5 6.5-6 6.5-1.5 0-3-1-3-2.5 0-1.5 1-2.5 2.5-2.5h1.5" transform="rotate(0 12 12)"/>' +
    '<path d="M12 12c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5c0 3.5-2.5 6.5-6 6.5-1.5 0-3-1-3-2.5 0-1.5 1-2.5 2.5-2.5h1.5" transform="rotate(120 12 12)"/>' +
    '<path d="M12 12c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5c0 3.5-2.5 6.5-6 6.5-1.5 0-3-1-3-2.5 0-1.5 1-2.5 2.5-2.5h1.5" transform="rotate(240 12 12)"/>',
    // Pentagrama
    '<circle cx="12" cy="12" r="10"/>' +
    '<path d="M12 2l3 9h9l-7 5 3 9-8-6-8 6 3-9-7-5h9z"/>',
    // Sol Alquímico
    '<circle cx="12" cy="12" r="8"/>' +
    '<circle cx="12" cy="12" r="1" fill="currentColor"/>',
    // Mercúrio Alquímico
    '<circle cx="12" cy="10" r="4"/>' +
    '<path d="M12 14v7 M8 18h8 M8 6a4 4 0 0 1 8 0"/>',
    // Semente da Vida
    '<circle cx="12" cy="12" r="4"/>' +
    '<circle cx="12" cy="8" r="4"/>' +
    '<circle cx="12" cy="16" r="4"/>' +
    '<circle cx="8.5" cy="10" r="4"/>' +
    '<circle cx="15.5" cy="10" r="4"/>' +
    '<circle cx="8.5" cy="14" r="4"/>' +
    '<circle cx="15.5" cy="14" r="4"/>',
    // Nó Celta
    '<path d="M7 4h10v4H7z M13 4v16 M7 16h10v4H7z M11 20V4 M4 7h16v10H4z"/>',
    // Foco Arcano
    '<circle cx="12" cy="12" r="10" stroke-dasharray="2 2"/>' +
    '<line x1="12" y1="2" x2="12" y2="22" opacity="0.5"/>' +
    '<line x1="2" y1="12" x2="22" y2="12" opacity="0.5"/>' +
    '<path d="M12 6 C15 6,18 9,18 12 C18 15,15 18,12 18 C9 18,6 15,6 12 C6 9,9 6,12 6 Z"/>' +
    '<circle cx="12" cy="12" r="2"/>',
    // Ankh
    '<path d="M12 2a4 4 0 0 1 4 4c0 2.21-1.79 4-4 4s-4-1.79-4-4a4 4 0 0 1 4-4z M12 10v12 M8 16h8"/>',
    // Olho de Hórus
    '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>' +
    '<circle cx="12" cy="12" r="3"/>' +
    '<path d="M12 17c0 0-3 2-3 4"/>' +
    '<path d="M12 19c0 0 3-1 3-3"/>',
    // Triquetra
    '<path d="M12 2c0 0 6 4 6 10s-6 10-6 10S6 18 6 12 12 2 12 2z M12 2c0 0-4 6-10 6s-10 6-10 6 4 6 10 6 10 6 10 6z M12 22c0 0 4-6 10-6s10-6 10-6-4-6-10-6-10-6-10-6z" transform="rotate(30 12 12)"/>' +
    '<circle cx="12" cy="12" r="4"/>',
    // Ouroboros
    '<path d="M12 2a10 10 0 1 0 10 10 10 10 0 0 0-10-10z M12 4a8 8 0 1 1-8 8 8 8 0 0 1 8-8z M10 6l2-2 2 2"/>' +
    '<circle cx="18" cy="12" r="1" fill="currentColor"/>',
    // Vegvisir
    '<line x1="12" y1="2" x2="12" y2="22"/>' +
    '<line x1="2" y1="12" x2="22" y2="12"/>' +
    '<line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>' +
    '<line x1="19.07" y1="4.93" x2="4.93" y2="19.07"/>' +
    '<circle cx="12" cy="2" r="1" fill="currentColor"/>' +
    '<circle cx="12" cy="22" r="1" fill="currentColor"/>' +
    '<circle cx="2" cy="12" r="1" fill="currentColor"/>' +
    '<circle cx="22" cy="12" r="1" fill="currentColor"/>' +
    '<path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z" stroke-dasharray="2 2"/>',
    // Hamsa
    '<path d="M12 2L8 6c0 0-2 4-2 8s2 8 6 8 6-4 6-8-2-8-2-8L12 2z M6 14s-2 2-2 4c0 2 2 4 2 4s2-2 2-4c0-2-2-4-2-4z M18 14s2 2 2 4c0 2-2 4-2 4s-2-2-2-4c0-2 2-4 2-4z"/>' +
    '<circle cx="12" cy="14" r="2"/>',
    // Nyarlathotep
    '<path d="M12 12m-6 0a6 6 0 1 0 12 0a6 6 0 1 0 -12 0" transform="skewX(30) skewY(15)"/>' +
    '<path d="M12 12 Q20 20 22 8 Q12 12 4 20"/>' +
    '<path d="M12 12 Q8 4 2 12 Q12 12 16 22"/>',
    // Yog-Sothoth
    '<circle cx="9" cy="9" r="6" stroke-dasharray="3 2"/>' +
    '<circle cx="17" cy="12" r="5"/>' +
    '<circle cx="10" cy="18" r="4"/>' +
    '<path d="M9 3 L17 7 M17 17 L10 22 M3 9 L10 18"/>' +
    '<circle cx="9" cy="9" r="1" fill="currentColor"/>',
    // O Chamado
    '<path d="M12 12 C 16 16,22 6,20 22 C 12 18,4 22,2 6 C 8 16,12 12,12 12 Z"/>' +
    '<circle cx="12" cy="7" r="2" transform="scale(1 1.5) translate(0 -2)"/>' +
    '<path d="M12 2 L12 5 M12 20 L12 22"/>',
    // R\'lyeh
    '<polygon points="2,6 16,4 20,16 6,20"/>' +
    '<polygon points="8,8 22,2 14,22 4,12"/>' +
    '<line x1="2" y1="6" x2="8" y2="8"/>' +
    '<line x1="16" y1="4" x2="22" y2="2"/>' +
    '<line x1="20" y1="16" x2="14" y2="22"/>' +
    '<line x1="6" y1="20" x2="4" y2="12"/>',
    // Hastur
    '<path d="M12 8 Q18 2 20 12 T12 22 T2 10 T12 8"/>' +
    '<path d="M12 14 C 18 14 16 20 22 22"/>' +
    '<path d="M10 12 C 4 12 6 6 2 4"/>' +
    '<path d="M14 10 C 14 4 20 6 22 2"/>',
    // Vigilância
    '<ellipse cx="12" cy="8" rx="6" ry="2.5" transform="rotate(15 12 8)"/>' +
    '<circle cx="12" cy="8" r="1"/>' +
    '<ellipse cx="6" cy="18" rx="4" ry="1.5" transform="rotate(-30 6 18)"/>' +
    '<circle cx="6" cy="18" r="0.5"/>' +
    '<ellipse cx="18" cy="16" rx="5" ry="2" transform="rotate(45 18 16)"/>' +
    '<circle cx="18" cy="16" r="1"/>' +
    '<path d="M12 12 Q15 16 12 20" stroke-dasharray="1 2"/>',
    // Sanidade
    '<circle cx="12" cy="12" r="9" stroke-dasharray="5 8"/>' +
    '<polyline points="2,14 8,10 10,16 15,8 22,12"/>' +
    '<line x1="10" y1="16" x2="12" y2="22"/>' +
    '<line x1="15" y1="8" x2="16" y2="2"/>',
    // Indizível
    '<path d="M2 12 C10 2 20 20 12 12 C4 4 14 22 22 12"/>' +
    '<path d="M12 2 C2 10 20 10 12 22"/>' +
    '<circle cx="12" cy="12" r="1"/>',
    // Azathoth
    '<path d="M12 2 Q14 10 22 12 Q14 14 12 22 Q10 14 2 12 Q10 10 12 2 Z" transform="rotate(25 12 12)"/>' +
    '<path d="M12 4 Q13 11 20 12 Q13 13 12 20 Q11 13 4 12 Q11 11 12 4 Z" transform="rotate(-35 12 12)" stroke-dasharray="2 2"/>' +
    '<circle cx="12" cy="12" r="3"/>',
    // Kadath
    '<path d="M12 12 L12 2 A10 10 0 0 1 22 12 A10 10 0 0 1 12 22 A10 10 0 0 1 2 12 A10 10 0 0 1 12 2" stroke-dasharray="1 4"/>' +
    '<path d="M3 3 L21 21 M3 21 L21 3"/>' +
    '<rect x="7" y="7" width="10" height="10" transform="rotate(15 12 12)"/>',
    // O Vazio
    '<path d="M12 2 C20 2 22 12 12 22 C2 12 4 2 12 2 Z"/>' +
    '<path d="M12 6 L14 10 L18 10 L15 13 L16 18 L12 15 L8 18 L9 13 L6 10 L10 10 Z" transform="scale(0.7) translate(5 5)"/>' +
    '<path d="M12 2 v4 M12 22 v-4 M2 12 h4 M22 12 h-4"/>',
    // Simbiose
    '<path d="M 12 12 Q 18 4,22 10 T 12 12 Q 4 20,2 14 T 12 12 Q 4 4,10 2 T 12 12 Q 20 20,14 22 T 12 12"/>' +
    '<circle cx="12" cy="12" r="5" stroke-dasharray="2 3"/>',
  ];

  // Shuffled pool of symbol indices (computed once); guarantees no repeats until all symbols are exhausted.
  const SYMBOL_POOL = (() => {
    const idx = Array.from({ length: SYMBOLS.length }, (_, i) => i);
    let sv = 0x9e3779b9;
    const rng = () => { sv ^= sv << 13; sv ^= sv >> 17; sv ^= sv << 5; return (sv >>> 0) / 0xffffffff; };
    for (let i = idx.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [idx[i], idx[j]] = [idx[j], idx[i]];
    }
    return idx;
  })();

  /**
   * Returns a symbol SVG for a player, coloured to their assigned colour.
   * @param {number} idx   - index into SYMBOLS (from SYMBOL_POOL assignment)
   * @param {string} color - hex colour
   * @returns {string} SVG markup
   */
  function pickSymbol(idx, color) {
    const [r,g,b] = hexToRgb(color);
    const c = `rgba(${r},${g},${b},0.82)`;
    return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke="${c}" fill="none" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" color="${c}" style="width:100%;height:100%;overflow:visible">${SYMBOLS[idx]}</svg>`;
  }

  /* ── Magic circle SVG ── */
  /**
   * Builds the decorative summoning circle SVG that fills the stage.
   * @param {number} S - stage size in pixels
   * @returns {string} SVG markup
   */
  function makeMagicSVG(S) {
    const cx=S/2, cy=S/2;
    const g='rgba(196,164,74,.2)', gm='rgba(196,164,74,.5)', gb='#c4a44a';

    const ticks = Array.from({length:24}, (_,i) => {
      const a = (i/24)*Math.PI*2, major = i%6===0;
      const r1 = cx*.88, r2 = cx*(major ? .96 : .925);
      return `<line x1="${f(cx+Math.cos(a)*r1)}" y1="${f(cy+Math.sin(a)*r1)}" x2="${f(cx+Math.cos(a)*r2)}" y2="${f(cy+Math.sin(a)*r2)}" stroke="${major?gm:g}" stroke-width="${major?1.6:.9}"/>`;
    }).join('');

    const spokes = Array.from({length:6}, (_,i) => {
      const a = (i/6)*Math.PI*2, r1=cx*.38, r2=cx*.72;
      return `<line x1="${f(cx+Math.cos(a)*r1)}" y1="${f(cy+Math.sin(a)*r1)}" x2="${f(cx+Math.cos(a)*r2)}" y2="${f(cy+Math.sin(a)*r2)}" stroke="${g}" stroke-width=".7"/>`;
    }).join('');

    const pr = cx*.28;
    const penta = [0,2,4,1,3].map(i => {
      const a = (i/5)*Math.PI*2 - Math.PI/2;
      return `${f(cx+Math.cos(a)*pr)},${f(cy+Math.sin(a)*pr)}`;
    }).join(' ');

    const rads = Array.from({length:8}, (_,i) => {
      const a = (i/8)*Math.PI*2, r1=cx*.08, r2=cx*.34;
      return `<line x1="${f(cx+Math.cos(a)*r1)}" y1="${f(cy+Math.sin(a)*r1)}" x2="${f(cx+Math.cos(a)*r2)}" y2="${f(cy+Math.sin(a)*r2)}" stroke="${g}" stroke-width=".7"/>`;
    }).join('');

    const arcs = Array.from({length:12}, (_,i) => {
      const a=( i   /12)*Math.PI*2, a2=((i+.5)/12)*Math.PI*2, r=cx*.915;
      const x1=f(cx+Math.cos(a)*r),  y1=f(cy+Math.sin(a)*r);
      const x2=f(cx+Math.cos(a2)*r), y2=f(cy+Math.sin(a2)*r);
      return `<path d="M ${x1} ${y1} A ${f(r)} ${f(r)} 0 0 1 ${x2} ${y2}" fill="none" stroke="${g}" stroke-width=".6"/>`;
    }).join('');

    return `<svg class="magic-svg" viewBox="0 0 ${S} ${S}" style="position:absolute;inset:0;pointer-events:none;" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sc-f-g"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="sc-f-s"><feGaussianBlur stdDeviation="7"   result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="sc-center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="rgba(80,30,160,0.18)"/>
      <stop offset="100%" stop-color="rgba(80,30,160,0)"/>
    </radialGradient>
  </defs>
  <circle cx="${cx}" cy="${cy}" r="${f(cx*.38)}" fill="url(#sc-center-glow)" filter="url(#sc-f-s)"/>
  <g class="ring-outer-g" style="transform-origin:${cx}px ${cy}px">
    <circle cx="${cx}" cy="${cy}" r="${f(cx*.95)}"  fill="none" stroke="${g}"  stroke-width=".7"/>
    <circle cx="${cx}" cy="${cy}" r="${f(cx*.905)}" fill="none" stroke="${gm}" stroke-width="1.5" filter="url(#sc-f-g)"/>
    ${ticks}${arcs}
  </g>
  <g class="ring-mid-g" style="transform-origin:${cx}px ${cy}px">
    <circle cx="${cx}" cy="${cy}" r="${f(cx*.72)}" fill="none" stroke="${gm}" stroke-width="1.1" stroke-dasharray="7 4"/>
    ${spokes}
  </g>
  <g class="ring-inner-g" filter="url(#sc-f-g)">
    <circle cx="${cx}" cy="${cy}" r="${f(cx*.36)}" fill="none" stroke="${gb}" stroke-width="1.5"/>
    <polygon points="${penta}" fill="rgba(196,164,74,.06)" stroke="${gb}" stroke-width="1.2" filter="url(#sc-f-g)"/>
    ${rads}
    <circle cx="${cx}" cy="${cy}" r="${f(cx*.058)}" fill="${gm}" filter="url(#sc-f-s)"/>
    <circle cx="${cx}" cy="${cy}" r="${f(cx*.026)}" fill="${gb}"/>
  </g>
</svg>`;
  }

  /* ── Starfield ── */
  function paintBg() {
    const bgEl = document.getElementById('bg');
    bgEl.width  = window.innerWidth;
    bgEl.height = window.innerHeight;
    const W = bgEl.width, H = bgEl.height;
    const ctx = bgEl.getContext('2d');

    ctx.fillStyle = '#04030a';
    ctx.fillRect(0, 0, W, H);

    [[.5,.5,.55,'rgba(38,10,75,0.48)'], [.16,.72,.35,'rgba(10,38,110,0.3)'], [.84,.24,.3,'rgba(75,14,48,0.22)']].forEach(([x,y,r,c]) => {
      const g = ctx.createRadialGradient(W*x,H*y,0,W*x,H*y,W*r);
      g.addColorStop(0,c); g.addColorStop(1,'transparent');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    });

    const rng = lcg(9473);
    for (let i=0; i<300; i++) {
      const x=rng()*W, y=rng()*H;
      const size = rng()<.82 ? rng()*.9+.1 : rng()*2.2+.5;
      const bright = rng() < .05;
      const hue = rng()<.6 ? 0 : rng()<.5 ? 220 : 280;
      ctx.beginPath(); ctx.arc(x,y,size,0,Math.PI*2);
      ctx.fillStyle = bright
        ? `hsla(${hue},60%,98%,${.7+rng()*.3})`
        : `hsla(${hue},25%,92%,${.12+rng()*.65})`;
      ctx.fill();
      if (bright) {
        const g2 = ctx.createRadialGradient(x,y,0,x,y,size*5);
        g2.addColorStop(0,`hsla(${hue},60%,90%,.18)`); g2.addColorStop(1,'transparent');
        ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(x,y,size*5,0,Math.PI*2); ctx.fill();
      }
    }
  }

  /* ── Build stage ── */
  /**
   * Builds the magic circle SVG and all player orbs for the current stage size.
   * @param {object[]} entries
   * @param {boolean}  showNames
   * @param {object}   soundCfg
   */
  function buildStage(entries, showNames, soundCfg) {
    const stage = document.getElementById('circle-stage');
    const S = stage.offsetWidth;
    if (!S) return;

    stage.querySelectorAll('.magic-svg, .player-orb').forEach(e => e.remove());
    stage.insertAdjacentHTML('afterbegin', makeMagicSVG(S));

    const n       = entries.length;
    const orbR    = S * 0.435;
    const cx      = S/2, cy = S/2;
    const orbSize = Math.max(52, Math.min(72, Math.floor(2 * Math.PI * orbR / n * 0.55)));
    const labelSz = Math.max(8, Math.floor(orbSize * 0.145));

    // Assign unique symbols: sort by userId hash for stable ordering, then draw from the shuffled pool
    const symbolByUid = {};
    [...entries].sort((a, b) => hashStr(a.userId) - hashStr(b.userId))
      .forEach((e, i) => { symbolByUid[e.userId] = SYMBOL_POOL[i % SYMBOL_POOL.length]; });

    entries.forEach(function(entry, i) {
      const angle = (i/n)*Math.PI*2 - Math.PI/2;
      const x = cx + Math.cos(angle)*orbR;
      const y = cy + Math.sin(angle)*orbR;
      const [r,g,b] = hexToRgb(entry.color || '#c4a44a');
      const name    = displayName(entry);
      const label   = name.length > 10 ? name.slice(0,9) + '…' : name;

      const el = document.createElement('div');
      el.className = 'player-orb' + (activeEntry?.userId === entry.userId ? ' active' : '');
      el.style.cssText = `left:${x}px;top:${y}px;--c:${r},${g},${b};width:${orbSize}px;height:${orbSize}px;animation-delay:${i*.07}s`;
      el.dataset.uid = entry.userId;

      el.innerHTML = `
        <div class="orb-shell" style="width:${orbSize}px;height:${orbSize}px">
          <span class="orb-mandala">${pickSymbol(symbolByUid[entry.userId], entry.color || '#c4a44a')}</span>
        </div>
        ${showNames ? `<div class="orb-label" style="font-size:${labelSz}px">${esc(label)}</div>` : ''}`;

      el.addEventListener('mouseenter', function() { onHover(entry); });
      el.addEventListener('mouseleave', function() { onLeave(); });
      el.addEventListener('click',      function() { onSelect(entry, el, soundCfg); });

      stage.appendChild(el);
    });

    // Re-draw connection if still active after rebuild
    if (activeEntry && activeOrbEl) {
      const restored = stage.querySelector(`[data-uid="${activeEntry.userId}"]`);
      if (restored) { activeOrbEl = restored; updateConn(activeEntry, restored); }
    }
  }

  /* ── Center display ── */
  function showName(name, color) {
    document.getElementById('c-hint').style.opacity = '0';
    const el = document.getElementById('c-name');
    el.textContent  = name;
    el.style.color       = color;
    el.style.textShadow  = `0 0 18px ${color}90, 0 0 42px ${color}44`;
    el.style.opacity     = '1';
    el.style.transform   = 'scale(1)';
  }
  function clearName() {
    document.getElementById('c-hint').style.opacity = '1';
    const el = document.getElementById('c-name');
    el.style.opacity   = '0';
    el.style.transform = 'scale(.85)';
  }

  /* ── Connection line ── */
  /**
   * Draws or clears the dotted connector line between the selected orb and center.
   * @param {object|null}    entry
   * @param {HTMLElement|null} orbEl
   */
  function updateConn(entry, orbEl) {
    const svg = document.getElementById('conn-svg');
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    if (!entry || !orbEl) return;

    const stage = document.getElementById('circle-stage');
    const S = stage.offsetWidth;
    const sRect = stage.getBoundingClientRect();
    const oRect = orbEl.getBoundingClientRect();
    const cx = S/2, cy = S/2;
    const ox = oRect.left - sRect.left + oRect.width/2;
    const oy = oRect.top  - sRect.top  + oRect.height/2;

    svg.setAttribute('viewBox', `0 0 ${S} ${S}`);
    const [r,g,b] = hexToRgb(entry.color || '#c4a44a');
    const ns = 'http://www.w3.org/2000/svg';

    function mkLine(cls, sw, opacity) {
      const ln = document.createElementNS(ns, 'line');
      ['x1','y1','x2','y2'].forEach((a,i) => ln.setAttribute(a, [cx,cy,ox,oy][i]));
      ln.setAttribute('stroke', `rgba(${r},${g},${b},${opacity})`);
      ln.setAttribute('stroke-width', sw);
      ln.setAttribute('class', cls);
      svg.appendChild(ln);
    }
    mkLine('conn-glow', 6,   .2);
    mkLine('conn-dash', 1.5, .7);
  }

  /* ── Deselect ── */
  function deselect() {
    activeEntry = null;
    activeOrbEl = null;
    document.querySelectorAll('.player-orb').forEach(o => o.classList.remove('active'));
    document.getElementById('circle-stage').classList.remove('activated');
    document.getElementById('center').classList.remove('clickable');
    updateConn(null, null);
    clearName();
  }

  /* ── Hover ── */
  function onHover(entry) {
    if (activeEntry) return;
    showName(displayName(entry), entry.color || '#c4a44a');
  }
  function onLeave() {
    if (activeEntry) return;
    clearName();
  }

  /* ── Select ── */
  /**
   * Handles clicking a player orb — selects it and draws the connection line.
   * Clicking the same orb twice deselects.
   * @param {object}      entry
   * @param {HTMLElement} orbEl
   * @param {object}      soundCfg
   */
  function onSelect(entry, orbEl, soundCfg) {
    // Toggle off if already active
    if (activeEntry?.userId === entry.userId) {
      deselect();
      return;
    }

    activeEntry = entry;
    activeOrbEl = orbEl;

    document.querySelectorAll('.player-orb').forEach(o => o.classList.toggle('active', o.dataset.uid === entry.userId));
    showName(displayName(entry), entry.color || '#c4a44a');
    updateConn(entry, orbEl);

    document.getElementById('center').classList.add('clickable');
    document.getElementById('circle-stage').classList.add('activated');

    // Hover sound on select
    const hoverSrc = entry.hoverSound || soundCfg.hoverSound || 'modules/custom-login/assets/sfx/hover.mp3';
    if (soundCfg.hoverSoundEnabled !== false) {
      const a = new Audio(toAbsolute(hoverSrc)); a.volume = 0.6; a.play().catch(() => {});
    }
  }

  /* ── Login via center click ── */
  /**
   * Triggered when the active center button is clicked.
   * Plays join sound and calls loginAs (with optional password dialog).
   * @param {object} entry
   * @param {object} soundCfg
   */
  function enterRealm(entry, soundCfg) {
    const joinSrc = entry.joinSound || soundCfg.joinSound || 'modules/custom-login/assets/sfx/join.mp3';
    function doLogin(pw) {
      if (soundCfg.joinSoundEnabled !== false) {
        const a = new Audio(toAbsolute(joinSrc)); a.volume = 0.8; a.play().catch(() => {});
      }
      loginAs(entry.userId, pw);
    }
    if (entry.requirePassword) showPasswordDialog(doLogin);
    else doLogin('');
  }

  /* ── Init ── */
  async function init() {
    injectSharedStyles();
    const statusEl = document.getElementById('cl-status');
    const jsonPath = await resolveJsonPath();
    if (!jsonPath) { await showNoWorldPage(); return; }

    const res = await fetch(jsonPath, { cache: 'no-cache' });
    if (res.status === 404) { await showNoWorldPage(); return; }
    if (!res.ok) { statusEl.textContent = 'Could not load player list (' + res.status + ').'; return; }

    const raw      = await res.json();
    const entries  = Array.isArray(raw) ? raw : (raw.entries    ?? []);
    const appear   = Array.isArray(raw) ? {}  : (raw.appearance ?? {});
    const soundCfg = Array.isArray(raw) ? {}  : (raw.sounds     ?? {});

    const faviconLink = document.createElement('link');
    faviconLink.rel  = 'shortcut icon';
    faviconLink.href = toAbsolute(appear.faviconUrl || 'modules/custom-login/assets/screens/favicon.ico');
    document.head.appendChild(faviconLink);

    document.title = appear.screenTitle || 'Welcome';

    const valid = entries.filter(e => e.userId);
    if (!valid.length) {
      statusEl.textContent = 'No players configured yet. Ask your GM to set up the welcome page.';
      return;
    }

    // Assign slot colours to entries (cycle through palette)
    const PALETTE = ['#c9a84c','#00f5d4','#9b5de5','#f72585','#4cc9f0','#7aff72','#ff6b35','#e040fb'];
    valid.forEach((e, i) => { e.color = e.color || PALETTE[i % PALETTE.length]; });

    const showNames = (appear.showNames ?? 'yes') !== 'no';

    // Stash for resize handler
    _entries   = valid;
    _showNames = showNames;
    _soundCfg  = soundCfg;

    statusEl.remove();

    paintBg();
    requestAnimationFrame(() => buildStage(valid, showNames, soundCfg));

    // Center click → login
    document.getElementById('center').addEventListener('click', function() {
      if (activeEntry) enterRealm(activeEntry, soundCfg);
    });

    // Escape → deselect
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') deselect();
    });

    window.addEventListener('resize', function() {
      paintBg();
      buildStage(_entries, _showNames, _soundCfg);
    });
  }

  init();
</script>
</body>
